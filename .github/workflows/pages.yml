# Veröffentlicht die App bei jedem Push auf main auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      # Relative Pfade (./assets/…): funktionieren unter <nutzer>.github.io/<repo>/ und unter einer
      # eigenen Domain im Wurzelverzeichnis (z. B. understand3d.tinfo.space). Ein fester Pfad /<repo>/
      # führt auf der eigenen Domain zu 404 für Skript und CSS – die Seite bleibt weiß.
      - name: Build mit relativen Pfaden
        run: pnpm run build
        env:
          PAGES_BASE: ./
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
